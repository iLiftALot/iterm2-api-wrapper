# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "iterm2-api-wrapper"

[setup]
script = '''
set -euo pipefail

PACKAGE="$(basename "$PWD")"
export UV_CACHE_DIR="/private/tmp/$PACKAGE-uv-cache"
export UV_SYSTEM_CERTS="true"
unset SSL_CERT_FILE

PYTHON_VERSION="${PYTHON_VERSION:-$(cat .python-version 2>/dev/null || printf '3.10')}"

uv sync --python="$PYTHON_VERSION" --group dev --group ci

export PYTHON_PATH="$(pwd)/.venv/bin/python"
export PYTHON_VERSION="$("$PYTHON_PATH" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"

mkdir -p .codex/bin

ln -sf "$PYTHON_PATH" .codex/bin/python
ln -sf "$PYTHON_PATH" .codex/bin/python3

cat > .codex/env.sh <<'EOF'
export PACKAGE="$(basename $PWD)"
export COMMAND="$(basename $PWD | tr '-' '_')"
export PYTHON_PATH="$(pwd)/.venv/bin/python"
export PYTHON_VERSION="$("$PYTHON_PATH" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"

export PATH="$PWD/.codex/bin:$PWD/.venv/bin:$PATH"
export UV_CACHE_DIR="/private/tmp/$PACKAGE-uv-cache"
export UV_SYSTEM_CERTS="true"
unset SSL_CERT_FILE
export UV_TOOL_DIR="$PWD/.codex/tools"
export UV_TOOL_BIN_DIR="$PWD/.codex/bin"

export IT2_PYTEST_INTEGRATION="0"
export IT2_DEFAULT_PROFILE="${IT2_DEFAULT_PROFILE:-pyterm-mcp}"
EOF
'''

[[actions]]
name = "Run Tests"
icon = "test"
command = '''
source .codex/env.sh
IT2_PYTEST_INTEGRATION=0 pytest
'''

# Requires unsandboxed/escalated execution.
# The normal Codex sandbox cannot reliably see a running iTerm2 process via PyObjC
# NSRunningApplication, which can force a false launch path and produce a misleading
# "iTerm.app is corrupt / executable missing" Launch Services error.
[[actions]]
name = "Run iTerm Integration Tests"
icon = "test"
command = '''
source .codex/env.sh
IT2_PYTEST_INTEGRATION=1 pytest tests/test_client_integration.py
'''

[[actions]]
name = "Lint"
icon = "tool"
command = '''
source .codex/env.sh
uv run --python="$PYTHON_VERSION" --group dev --group ci ruff check .
'''

[[actions]]
name = "Format Check"
icon = "tool"
command = '''
source .codex/env.sh
uv run --python="$PYTHON_VERSION" --group dev --group ci ruff format --check .
'''

[[actions]]
name = "Format"
icon = "tool"
command = '''
source .codex/env.sh
uv run --python="$PYTHON_VERSION" --group dev --group ci ruff format .
'''

[[actions]]
name = "Typecheck"
icon = "tool"
command = '''
source .codex/env.sh
uv run --python="$PYTHON_VERSION" --group dev --group ci pyright ./src ./tests
'''

[[actions]]
name = "Verify Project Executables"
icon = "tool"
command = '''
source .codex/env.sh

command -v python
python --version

command -v "$COMMAND"

"$COMMAND" --help
'''

[[actions]]
name = "Install Project Executables"
icon = "tool"
command = '''
source .codex/env.sh

uv tool install --force --editable . --project=. --python=./.venv/bin/python

command -v "$COMMAND"
'''

[[actions]]
name = "Show Tools with Paths"
icon = "tool"
command = '''
source .codex/env.sh
uv tool list --show-paths
'''
