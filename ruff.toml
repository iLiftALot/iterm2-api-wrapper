output-format = "full"
target-version = "py310"
line-length = 120
indent-width = 4
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
  "code_examples",
  "miniconda3",
  "cpython-3.*"
]
include = ["**{src,tests,test}/**/*.py", "**{src,tests,test}/**/*.ipynb"]
force-exclude = true
fix = true

[lint]
extend-select = [
  "A",  # prevent using keywords that clobber python builtins
  "B",  # bugbear: security warnings
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort: import formatting
  "ISC",  # implicit string concatenation
  "UP",  # alert you when better syntax is available in your python version
  "RUF",  # the ruff developer's own rules
]
ignore = [
  "D",       # ignore missing docs
  "TC",      # false positives for local imports
  "E501",    # line too long
  "I001",    # unsorted imports
  "TRY003",  # external messages in exceptions are too verbose
  "UP035",   # Checks for uses of deprecated imports based on the minimum supported Python version.
  "UP006",   # Checks for the use of generics that can be replaced with standard library variants based on PEP 585.
  "UP007",   # Check for type annotations that can be rewritten based on PEP 604 syntax.
  "UP015",   # Checks for redundant open mode arguments.
  "UP040",   # Checks for use of TypeAlias annotations and TypeAliasType assignments for declaring type aliases.
  "UP045",   # Check for typing.Optional annotations that can be rewritten based on PEP 604 syntax.
  "A002",    # Checks for function arguments that use the same names as builtins
  "B905",    # `zip()` without an explicit `strict=` parameter
  "BLE001",  # Checks for except clauses that catch all exceptions. This includes except BaseException and except Exception.
  "PLE1205", # Checks for too many positional arguments for a logging format string.
  "PYI034"   # Checks for methods that are annotated with a fixed return type which should instead be returning Self.
]
fixable = [ # ruff check . --fix
  "TRY004",
  "F401",
  "UP035",
  "I001",
  "PLR1711",
  "PLR1722",
  "B011",
  "F541",
  "FURB105",
  "PIE810",
  "SIM115",
  "UP032",
  "C402",
  "RUF005",
  "UP028",
  "UP031",
  "RUF021",
  "UP033",
  "RUF010",
  "RUF007",
  "E731"
]

[lint.per-file-ignores]
"it2selection.py" = ["PYI042"]
"tests/*_.py" = ["N999"]

[lint.isort]
force-wrap-aliases = false
force-sort-within-sections = false
split-on-trailing-comma = true
lines-after-imports = 2
lines-between-types = 0

[format]
line-ending = "auto"
docstring-code-line-length = 90
docstring-code-format = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
exclude = ["**/api/__init__.py"]

[analyze]
type-checking-imports = false
