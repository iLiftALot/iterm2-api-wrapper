# This workflow installs dependencies, lints, tests, and verifies formatting.
# Note: GitHub Actions runs after a push reaches GitHub; use a local pre-push hook to block pushes locally.

name: Validate

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  build:
    name: Lint, test, and format check
    runs-on: macos-latest
    env:
      PYTHON_VERSION: "3.10"
      IT2_PYTEST_INTEGRATION: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          uv sync --group=dev --group=ci

      - name: Lint
        run: |
          uv run ruff check src tests

      - name: Type Check
        run: |
          uv run --python="$PYTHON_VERSION" --group dev --group ci pyright ./src ./tests

      - name: Run Tests
        run: |
          uv run pytest

      - name: Check Formatting
        run: |
          uv run ruff format --check src tests
